<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cronograma — Gantt</title>
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1>Cronograma ApexDrive</h1>
      <p>Planeación y seguimiento de avance por tarea</p>
    </div>
    <div class="stat-strip" id="statStrip"></div>
  </header>

  <section class="panel">
    <h2><span class="dot"></span> Agregar / editar actividad</h2>
    <form class="task-form" id="taskForm">
      <div class="field">
        <label for="fName">Actividad</label>
        <input id="fName" type="text" placeholder="Nombre de la actividad" required>
      </div>
      <div class="field">
        <label for="fStart">Inicio</label>
        <input id="fStart" type="date" required>
      </div>
      <div class="field">
        <label for="fEnd">Fin</label>
        <input id="fEnd" type="date" required>
      </div>
      <div class="field">
        <label for="fAssignee">Responsable</label>
        <input id="fAssignee" type="text" placeholder="Nombre">
      </div>
      <div class="field">
        <label for="fPct">Avance %</label>
        <input id="fPct" type="number" min="0" max="100" value="0">
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn">Agregar</button>
      <button type="button" class="btn btn-ghost" id="cancelEditBtn" style="display:none;">Cancelar</button>
      <div class="form-msg" id="formMsg"></div>
    </form>
  </section>

  <section class="gantt-card" id="ganttCard">
    <div class="gantt-scroll" id="ganttScroll"></div>
  </section>

  <div class="legend">
    <div class="swatch-demo"></div>
    <span>La franja llena muestra el porcentaje de avance dentro de cada barra</span>
  </div>

</div>

</body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="server.js"></script>
</html>
